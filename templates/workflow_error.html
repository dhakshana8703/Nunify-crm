{% extends 'base.html' %}

{% block title %}Action unavailable | Nunify CRM{% endblock %}

{% block content %}
  <header class="page-header"><h1>{{ title|default('Action unavailable', true) }}</h1></header>
  <section class="source-panel workflow-panel-body" aria-label="Details">
    <p>{{ message|default('That action could not be completed.', true) }}</p>
    <p class="error-back"><a class="text-link" href="{{ back_url|default(url_for('home'), true) }}">{{ back_label|default('Return to workspace', true) }}</a></p>
  </section>
{% endblock %}
